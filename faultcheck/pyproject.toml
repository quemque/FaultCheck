[project]
name = "faultcheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
faultcheck = "faultcheck.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
